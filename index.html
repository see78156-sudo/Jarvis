<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07131f">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Jarvis AI</title>
<style>
  :root { color-scheme:dark; --bg:#07131f; --ink:#d8f3ff; --dim:#6f93a8; --cyan:#3fd8ff; --blue:#2b7bff; --line:#14405a; --card:#0d2a3d; --bar:#0b1f2f; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:system-ui,"Segoe UI",Tahoma,sans-serif; height:100dvh; }
  #app { display:flex; flex-direction:row; height:100%; padding-top:env(safe-area-inset-top,0px); }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; height:100%; }
  #app[hidden], #auth[hidden], [hidden] { display:none !important; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); }
  .core { width:34px; height:34px; border-radius:50%; border:2px solid var(--cyan); position:relative; flex:none; box-shadow:0 0 14px #3fd8ff66; }
  .core::after { content:""; position:absolute; inset:9px; border-radius:50%; background:var(--cyan); }
  .core.busy::after { animation:pulse .8s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(1.5); opacity:.6; } }
  @media (prefers-reduced-motion:reduce) { .core.busy::after { animation:none; } }
  h1 { font-size:18px; margin:0; letter-spacing:.5px; flex:1; }
  .tools { display:flex; align-items:center; gap:10px; }
  label { display:flex; align-items:center; gap:4px; font-size:14px; color:var(--dim); }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .m { padding:10px 14px; border-radius:14px; max-width:88%; line-height:1.8; font-size:17px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .me { align-self:flex-start; background:var(--card); border:1px solid var(--line); }
  .ai { align-self:flex-end; border:1px solid var(--cyan); }
  .m img { display:block; max-width:100%; max-height:220px; border-radius:8px; margin-bottom:8px; }
  .m .file { display:block; color:var(--cyan); font-size:15px; margin-bottom:6px; }
  #note { padding:0 16px; font-size:14px; color:#ffb347; }
  #note:empty { display:none; }

  /* صندوق الكتابة */
  .wrap { padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px)); }
  .composer { max-width:780px; margin:0 auto; background:var(--bar); border:1px solid var(--line); border-radius:26px;
              padding:10px 12px 10px; transition:border-color .15s, box-shadow .15s; }
  .composer:focus-within { border-color:var(--cyan); box-shadow:0 0 0 3px #3fd8ff1f, 0 0 24px #3fd8ff33; }
  #chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; }
  #chips:empty { display:none; }
  .chip { flex:none; display:flex; align-items:center; gap:6px; padding:6px 8px 6px 10px; border:1px solid var(--line);
          border-radius:12px; background:var(--bg); font-size:13px; max-width:190px; }
  .chip img { width:40px; height:40px; object-fit:cover; border-radius:8px; }
  .chip span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip button { padding:0 6px; background:transparent; color:#ff7b7b; font-size:18px; line-height:1; border:0; }
  textarea { display:block; width:100%; resize:none; background:transparent; border:0; outline:0; color:var(--ink);
             font:inherit; font-size:17px; line-height:1.6; max-height:140px; padding:6px 4px; }
  textarea::placeholder { color:var(--dim); }
  .row { display:flex; align-items:center; gap:8px; margin-top:6px; }
  .ic, .send { width:42px; height:42px; padding:0; border-radius:50%; display:grid; place-items:center; flex:none; }
  .ic { background:transparent; color:var(--cyan); border:1px solid var(--line); }
  .ic:active { background:#0d2a3d; }
  .ic.live { background:linear-gradient(135deg,var(--cyan),var(--blue)); color:#032033; border-color:transparent; box-shadow:0 0 14px #3fd8ff55; }
  .send { margin-inline-start:auto; background:#123a52; color:#7fa8bd; transition:background .15s, color .15s, box-shadow .15s; }
  .send.on { background:linear-gradient(135deg,var(--cyan),var(--blue)); color:#032033; box-shadow:0 0 16px #3fd8ff66; }
  svg { display:block; }
  .attach { position:relative; }
  #menu { position:absolute; bottom:125%; inset-inline-start:0; display:flex; flex-direction:column; gap:2px; padding:8px;
          background:var(--card); border:1px solid var(--cyan); border-radius:14px; z-index:5; min-width:190px; box-shadow:0 8px 28px #000a; }
  #menu button { text-align:start; background:transparent; color:var(--ink); border:0; padding:11px 10px; font-weight:500; font-size:16px; border-radius:8px; }
  #menu button:active { background:#14405a; }
  button { padding:12px 16px; border:0; border-radius:10px; background:var(--cyan); color:#032033; font-weight:700; font-size:16px; }
  button.ghost { background:transparent; color:var(--cyan); border:1px solid var(--cyan); padding:6px 12px; font-size:14px; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline:3px solid #fff; outline-offset:2px; }


  /* القايمة الجانبية (المحادثات المحفوظة) */
  #side { width:280px; flex:none; background:var(--bar); border-inline-end:1px solid var(--line); display:flex; flex-direction:column; height:100%; }
  .sidehead { padding:12px; }
  .newbtn { width:100%; padding:12px; border-radius:12px; background:linear-gradient(135deg,var(--cyan),var(--blue)); color:#032033; font-size:16px; box-shadow:0 0 14px #3fd8ff44; }
  #list { flex:1; overflow-y:auto; padding:4px 8px; display:flex; flex-direction:column; gap:4px; }
  .item { display:flex; align-items:center; gap:6px; padding:10px 12px; border-radius:10px; cursor:pointer; color:var(--ink); font-size:15px; border:1px solid transparent; }
  .item:hover { background:#0d2a3d; }
  .item.on { background:#123a52; border-color:var(--line); }
  .item span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item button { background:transparent; color:var(--dim); padding:2px 6px; font-size:16px; border:0; }
  .empty { color:var(--dim); font-size:14px; padding:16px; text-align:center; line-height:1.7; }
  .sidefoot { border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px)); display:flex; align-items:center; gap:8px; }
  #who { flex:1; font-size:12px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:ltr; text-align:start; }
  #burger { display:none; }
  @media (max-width:860px) {
    #side { position:fixed; top:0; bottom:0; inset-inline-start:0; width:min(82vw,310px); z-index:30; transform:translateX(100%);
            transition:transform .2s; padding-top:env(safe-area-inset-top,0px); }
    #side.open { transform:none; }
    #burger { display:grid; }
    #back { position:fixed; inset:0; background:#000a; z-index:20; }
  }

  /* وضع اللايف (محادثة صوتية) */
  #liveov { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px;
            background:radial-gradient(ellipse at 50% 35%, #0f3a57 0%, var(--bg) 70%); text-align:center; }
  .orb { width:min(52vw,230px); aspect-ratio:1; border-radius:50%; border:3px solid var(--cyan); position:relative; cursor:pointer;
         box-shadow:0 0 40px #3fd8ff66, inset 0 0 40px #3fd8ff33; }
  .orb::before { content:""; position:absolute; inset:14%; border-radius:50%; border:2px dashed var(--cyan); opacity:.7; animation:spin 14s linear infinite; }
  .orb::after { content:""; position:absolute; inset:34%; border-radius:50%; background:radial-gradient(circle,#fff,var(--cyan)); box-shadow:0 0 30px var(--cyan); }
  .orb.listening::after { animation:pulse 1.6s ease-in-out infinite; }
  .orb.thinking::before { animation-duration:1.4s; }
  .orb.speaking::after { animation:pulse .55s ease-in-out infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce) { .orb::before, .orb::after { animation:none !important; } }
  #lstat { font-size:22px; font-weight:700; }
  #lsay { min-height:56px; max-width:640px; color:var(--dim); font-size:18px; line-height:1.7; overflow-wrap:anywhere; }
  .lbtns { display:flex; gap:12px; margin-top:6px; }
  .endbtn { background:#c0392b; color:#fff; padding:12px 28px; border-radius:14px; }
  #vset { position:fixed; inset:0; z-index:60; background:#000b; display:grid; place-items:center; padding:16px; overflow-y:auto; }
  .vcard { width:min(94vw,440px); background:var(--bar); border:1px solid var(--cyan); border-radius:20px; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .vcard h3 { margin:0; font-size:19px; }
  .vcard label { flex-direction:column; align-items:stretch; gap:6px; color:var(--ink); font-size:14px; }
  .vcard select { width:100%; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:15px; }
  .vcard input[type=range] { width:100%; }

  /* شاشة التسجيل */
  #auth { position:fixed; inset:0; display:grid; place-items:center; padding:20px; overflow-y:auto;
          background:radial-gradient(ellipse at 50% 0%, #0d2a3d 0%, var(--bg) 65%); }
  .authcard { width:min(92vw,400px); background:var(--bar); border:1px solid var(--line); border-radius:24px; padding:26px 22px;
              display:flex; flex-direction:column; gap:12px; box-shadow:0 0 40px #3fd8ff22; text-align:center; }
  .authcard .core { width:64px; height:64px; margin:0 auto; }
  .authcard .core::after { inset:18px; }
  .authcard h2 { margin:4px 0 0; font-size:24px; letter-spacing:.5px; }
  .authcard .sub { margin:0; color:var(--dim); font-size:15px; }
  .tabs { display:flex; gap:6px; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:4px; }
  .tab { flex:1; background:transparent; color:var(--dim); padding:10px; font-size:15px; border-radius:9px; }
  .tab.on { background:linear-gradient(135deg,var(--cyan),var(--blue)); color:#032033; }
  .authcard input { width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:16px; text-align:start; }
  .authcard input:focus { border-color:var(--cyan); }
  .primary { background:linear-gradient(135deg,var(--cyan),var(--blue)); color:#032033; padding:14px; border-radius:12px; font-size:17px; box-shadow:0 0 16px #3fd8ff44; }
  .primary:disabled { opacity:.6; }
  .link { background:transparent; color:var(--cyan); font-weight:500; font-size:14px; padding:6px; }
  #amsg { min-height:22px; font-size:14px; line-height:1.6; color:#ff8a8a; }
  #amsg.ok { color:#6fe3a0; }
  .by { margin:0; color:var(--dim); font-size:12px; }
</style>
</head>
<body>

<div id="auth" hidden>
  <div class="authcard">
    <div class="core"></div>
    <h2>Jarvis AI</h2>
    <p class="sub">سجّل دخولك عشان تبدأ</p>
    <div class="tabs">
      <button id="tLogin" class="tab on" type="button">تسجيل دخول</button>
      <button id="tReg" class="tab" type="button">حساب جديد</button>
    </div>
    <input id="em" type="email" dir="ltr" placeholder="الإيميل" autocomplete="email" inputmode="email">
    <input id="pw" type="password" dir="ltr" placeholder="كلمة السر" autocomplete="current-password">
    <button id="submit" class="primary" type="button">دخول</button>
    <div id="amsg" role="alert"></div>
    <button id="forgot" class="link" type="button">نسيت كلمة السر؟</button>
    <p class="by">تطوير سيف إسلام</p>
  </div>
</div>

<div id="app" hidden>
  <div id="back" hidden></div>
  <aside id="side" aria-label="المحادثات">
    <div class="sidehead"><button id="newChat" class="newbtn" type="button">＋ محادثة جديدة</button></div>
    <div id="list"></div>
    <div class="sidefoot">
      <span id="who"></span>
      <button id="vbtn" class="ghost" type="button" aria-label="إعدادات الصوت">🔊</button>
      <button id="out" class="ghost" hidden>خروج</button>
    </div>
  </aside>
  <div id="main">
  <header>
    <button id="burger" class="ic" aria-label="المحادثات">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="core" id="core"></div>
    <h1>Jarvis AI</h1>
    <div class="tools">
      <label><input id="sp" type="checkbox"> صوت</label>
    </div>
  </header>
  <div id="log" aria-live="polite"></div>
  <div id="note"></div>
  <div class="wrap">
    <div class="composer">
      <div id="chips"></div>
      <textarea id="t" rows="1" placeholder="اسأل جارفيس..." enterkeyhint="send" autocomplete="off"></textarea>
      <div class="row">
        <div class="attach">
          <button id="plus" class="ic" aria-label="إرفاق صورة أو ملف">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <div id="menu" hidden>
            <button data-k="cam">📷 كاميرا</button>
            <button data-k="img">🖼️ صورة من المعرض</button>
            <button data-k="file">📄 ملف (PDF أو نص)</button>
          </div>
        </div>
        <button id="mic" class="ic" aria-label="تحدث">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
        </button>
        <button id="liveBtn" class="ic live" type="button" aria-label="محادثة صوتية مباشرة">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>
        </button>
        <button id="go" class="send" aria-label="إرسال">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </div>
  </div>
</div>

<div id="liveov" hidden>
  <div class="orb" id="orb" role="button" aria-label="اضغط لإيقاف الكلام أو لإنهاء السماع"></div>
  <div id="lstat">بسمعك...</div>
  <div id="lsay"></div>
  <div class="lbtns">
    <button id="lvoice" class="ghost" type="button">🔊 الصوت</button>
    <button id="lend" class="endbtn" type="button">إنهاء</button>
  </div>
</div>

<div id="vset" hidden>
  <div class="vcard">
    <h3>إعدادات الصوت</h3>
    <label>صوت الرد بالعربي<select id="vAr"></select></label>
    <label>صوت الرد بالإنجليزي<select id="vEn"></select></label>
    <label>نبرة الصوت (أقل = أتخن)<input id="vPitch" type="range" min="0.5" max="1.5" step="0.05"></label>
    <label>سرعة الكلام<input id="vRate" type="range" min="0.7" max="1.3" step="0.05"></label>
    <label>لغة الاستماع<select id="vListen">
      <option value="ar-EG">عربي (مصري)</option><option value="ar-SA">عربي (سعودي)</option>
      <option value="en-US">English (US)</option><option value="en-GB">English (UK)</option></select></label>
    <div class="lbtns"><button id="vTest" class="ghost" type="button">جرّب الصوت</button><button id="vClose" type="button">تمام</button></div>
    <p class="by">الأصوات المتاحة بتيجي من جهازك. ممكن تنزّل أصوات أحسن من إعدادات الكلام (Text-to-speech) في التليفون.</p>
  </div>
</div>

<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fImg" accept="image/*" multiple hidden>
<input type="file" id="fFile" accept=".pdf,.txt,.md,.csv,.json,.xml,.yaml,.yml,.log,.py,.js,.html,.css,text/*,application/pdf" multiple hidden>

<script>
const $ = id => document.getElementById(id);
const log = $("log"), t = $("t"), sp = $("sp"), core = $("core"), chips = $("chips"), menu = $("menu"), goBtn = $("go");
const MAX_FILES = 3, MAX_B64 = 7 * 1024 * 1024;
let busy = false, atts = [], chats = [], cur = null, store = null;
const ERR_MARK = "\u200b\u2060\u200b";
let CFG = { authEnabled: false, apiKey: "", requireVerified: false };
let tok = { id: "", refresh: "", exp: 0 };

function lsGet(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

function sid() {
  let s = lsGet("jid");
  if (!s) { s = Math.random().toString(36).slice(2) + Date.now().toString(36); lsSet("jid", s); }
  return s;
}
const SID = sid();

/* ---------- تسجيل الدخول (Firebase Auth عن طريق REST) ---------- */
const FB = "https://identitytoolkit.googleapis.com/v1/accounts:";
async function fb(path, body) {
  const r = await fetch(FB + path + "?key=" + encodeURIComponent(CFG.apiKey), {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || "ERROR");
  return j;
}
function setTok(id, refresh, expiresIn) {
  tok = { id: id, refresh: refresh, exp: Date.now() + (parseInt(expiresIn, 10) - 90) * 1000 };
  lsSet("jrt", refresh);
}
async function refreshTok() {
  const rt = tok.refresh || lsGet("jrt");
  if (!rt) return false;
  try {
    const r = await fetch("https://securetoken.googleapis.com/v1/token?key=" + encodeURIComponent(CFG.apiKey), {
      method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(rt) });
    if (!r.ok) return false;
    const j = await r.json();
    setTok(j.id_token, j.refresh_token, j.expires_in);
    return true;
  } catch (e) { return false; }
}
async function getToken() {            // "" = التسجيل مقفول، null = لازم يسجل دخول
  if (!CFG.authEnabled) return "";
  if (!tok.id || Date.now() > tok.exp) { if (!(await refreshTok())) return null; }
  return tok.id;
}
function signOut() { if (typeof endLive === "function") endLive(); tok = { id: "", refresh: "", exp: 0 }; lsDel("jrt"); chats = []; cur = null; store = null; log.innerHTML = ""; showAuth(); }
function authHeaders() {
  const h = { "Content-Type": "application/json" };
  if (CFG.authEnabled && tok.id) h["Authorization"] = "Bearer " + tok.id;
  return h;
}

const ERR = [
  ["EMAIL_EXISTS", "الإيميل ده مسجّل قبل كده. جرّب تسجيل الدخول."],
  ["INVALID_LOGIN_CREDENTIALS", "الإيميل أو كلمة السر غلط."],
  ["INVALID_PASSWORD", "الإيميل أو كلمة السر غلط."],
  ["EMAIL_NOT_FOUND", "الإيميل أو كلمة السر غلط."],
  ["INVALID_EMAIL", "اكتب إيميل صحيح."],
  ["MISSING_EMAIL", "اكتب الإيميل."],
  ["MISSING_PASSWORD", "اكتب كلمة السر."],
  ["WEAK_PASSWORD", "كلمة السر ضعيفة. لازم 6 حروف على الأقل."],
  ["TOO_MANY_ATTEMPTS", "محاولات كتير. استنى شوية وجرّب تاني."],
  ["USER_DISABLED", "الحساب ده متوقف."],
  ["OPERATION_NOT_ALLOWED", "التسجيل بالإيميل مش متفعّل في Firebase لسه."],
  ["API_KEY", "مفتاح Firebase غلط. راجع الإعدادات."]
];
function arErr(m) { m = String(m || ""); for (const [k, v] of ERR) if (m.indexOf(k) === 0 || m.indexOf(k) > -1) return v; return "حصل خطأ. جرّب تاني."; }

let mode = "login";
function setMode(m) {
  mode = m;
  $("tLogin").classList.toggle("on", m === "login");
  $("tReg").classList.toggle("on", m === "register");
  $("submit").textContent = m === "login" ? "دخول" : "إنشاء الحساب";
  $("pw").autocomplete = m === "login" ? "current-password" : "new-password";
  $("pw").placeholder = m === "login" ? "كلمة السر" : "كلمة السر (6 حروف على الأقل)";
  $("forgot").hidden = m !== "login";
  amsg("");
}
function amsg(text, ok) { const e = $("amsg"); e.textContent = text; e.className = ok ? "ok" : ""; }

async function submitAuth() {
  const email = $("em").value.trim(), pw = $("pw").value;
  if (!email || !pw) { amsg("اكتب الإيميل وكلمة السر."); return; }
  const btn = $("submit"); btn.disabled = true; amsg("");
  try {
    if (mode === "register") {

async function fsReq(method, path, body) {

    "/databases/(default)/documents/users/" + encodeURIComponent(uid()) + "/chats" + path;
  const r = await fetch(url, { method: method, headers: { "Authorization": "Bearer " + tk, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined });

  return r.status === 204 ? {} : r.json();
}
const cloud = {
  async list() {
    const j = await fsReq("GET", "?pageSize=60&orderBy=updated%20desc&mask.fieldPaths=title&mask.fieldPaths=updated");
    return (j.documents || []).map(d => ({ id: d.name.split("/").pop(), title: ((d.fields || {}).title || {}).stringValue || "محادثة",
      updated: parseInt(((d.fields || {}).updated || {}).integerValue || "0", 10) }));

function fromImage(f) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => {
      const M = 1280; let w = img.naturalWidth, h = img.naturalHeight;
      const k = Math.min(1, M / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      const d = c.toDataURL("image/jpeg", 0.82);
      URL.revokeObjectURL(url);
      res({ type: "image", name: f.name || "صورة", data: d.split(",")[1], thumb: d });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("مقدرتش أقرا الصورة دي")); };
    img.src = url;
  });
}

    r.onload = () => res({ type: "pdf", name: f.name, data: String(r.result).split(",")[1] });
    r.onerror = () => rej(new Error("مقدرتش أقرا الملف"));

}

function cleanSpeech(x) {
  return String(x).replace(/https?:\/\/\S+/g, " ").replace(/[*_`#>~|]/g, " ")
    .replace(/\p{Extended_Pictographic}/gu, "").replace(/\s+/g, " ").trim();
}
function chunkText(x, max) {
  max = max || 180;
  const parts = x.match(/[^.!?؟…\n]+[.!?؟…\n]*/g) || [x];
  const out = []; let c = "";
  for (const p of parts) { if ((c + p).length > max && c) { out.push(c.trim()); c = p; } else c += p; }
  if (c.trim()) out.push(c.trim());
  const res = [];
  out.forEach(piece => {
    if (piece.length <= max * 1.6) { res.push(piece); return; }
    let b = "";
    piece.split(/\s+/).forEach(w => { if ((b + " " + w).length > max && b) { res.push(b); b = w; } else b = b ? b + " " + w : w; });
    if (b) res.push(b);
  });
  return res;
}
const MALE_RE = /(^|[^e])male|daniel|ryan|george|arthur|oliver|thomas|james|maged|majed|naayf|hamed|tarik|shakir|hamza/i;
function pickVoice(voices, langs, savedName) {
  if (savedName) { const v = voices.find(x => x.name === savedName); if (v) return v; }
  for (const lang of langs) {
    const pool = voices.filter(v => v.lang && v.lang.toLowerCase().replace("_", "-").indexOf(lang) === 0);
    if (!pool.length) continue;
    return pool.find(v => MALE_RE.test(v.name)) || pool[0];
  }
  return null;
}
/*VOICE-END*/

let vs = { ar: "", en: "", pitch: 0.9, rate: 0.95, listen: "ar-EG" };
try { Object.assign(vs, JSON.parse(lsGet("jvoice") || "{}")); } catch (e) {}
function saveVs() { lsSet("jvoice", JSON.stringify(vs)); }
const sleep = ms => new Promise(r => setTimeout(r, ms));
let speakId = 0;
function cancelSpeak() { speakId++; try { speechSynthesis.cancel(); } catch (e) {} }
function speak(text) {
  return new Promise(res => {
    if (!("speechSynthesis" in window)) return res();
    const clean = cleanSpeech(text);
    if (!clean) return res();
    cancelSpeak();
    const my = speakId, chunks = chunkText(clean), voices = speechSynthesis.getVoices();
    let i = 0;
    const next = () => {
      if (my !== speakId || i >= chunks.length) return res();
      const piece = chunks[i++], ar = /[\u0600-\u06FF]/.test(piece);
      const u = new SpeechSynthesisUtterance(piece);
      const v = ar ? pickVoice(voices, ["ar-eg", "ar"], vs.ar) : pickVoice(voices, ["en-gb", "en"], vs.en);
      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = ar ? "ar-SA" : "en-GB";
      u.pitch = vs.pitch; u.rate = vs.rate;
      u.onend = next; u.onerror = () => res();
      speechSynthesis.speak(u);
    };
    next();
  });
}

const SRC = window.SpeechRecognition || window.webkitSpeechRecognition;
let live = false, recog = null, wake = null;
const liveov = $("liveov"), orb = $("orb");
function setLive(state, label) { orb.className = "orb " + state; $("lstat").textContent = label; }
function listenOnce() {
  return new Promise(res => {
    if (!SRC) return res(null);
    const r = new SRC(); recog = r;
    r.lang = vs.listen; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
    let fin = "", interim = "", done = false;
    const end = v => { if (done) return; done = true; recog = null; res(v); };
    r.onresult = e => {
      interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const tr = e.results[i][0].transcript;
        if (e.results[i].isFinal) fin += tr; else interim += tr;
      }
      $("lsay").textContent = (fin + interim).trim();
    };
    r.onerror = e => end(e.error === "not-allowed" || e.error === "service-not-allowed" ? null : "");
    r.onend = () => end((fin || interim).trim());
    try { r.start(); } catch (e) { end(""); }
  });
}
async function liveLoop() {
  let idle = 0;
  while (live) {
    setLive("listening", "بسمعك..."); $("lsay").textContent = "";
    const heard = await listenOnce();
    if (!live) break;
    if (heard === null) { note("المايك مش مسموح أو المتصفح مش بيدعم الصوت."); endLive(); break; }
    if (!heard) { if (++idle >= 8) { note("مسمعتش حاجة، قفلت اللايف."); endLive(); break; } await sleep(300); continue; }
    idle = 0;
    setLive("thinking", "بفكر..."); $("lsay").textContent = heard;
    t.value = heard; fit(); upd();
    await send();
  }
}
async function startLive() {
  if (!SRC) { alert("المتصفح ده مش بيدعم التعرف على الصوت. استخدم Chrome."); return; }
  if (busy) { note("استنى لما جارفيس يخلّص رده."); return; }
  live = true; liveov.hidden = false; closeDrawer();
  try { if (navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); } catch (e) {}

}

  try { if (recog) recog.abort(); } catch (e) {}
  try { if (wake) wake.release(); } catch (e) {}
  wake = null;
}
orb.onclick = () => {
  if (orb.classList.contains("speaking")) cancelSpeak();
  else if (orb.classList.contains("listening") && recog) { try { recog.stop(); } catch (e) {} }
};
$("lend").onclick = endLive;
$("liveBtn").onclick = startLive;

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
$("mic").onclick = () => {
  if (!SR) { alert("المتصفح ده مش بيدعم التعرف على الصوت. استخدم Chrome."); return; }
  const r = new SR(); r.lang = "ar-EG";
  r.onresult = e => { t.value = e.results[0][0].transcript; fit(); upd(); send(); };
  r.start();
};

if ("serviceWorker" in navigator) { navigator.serviceWorker.register("/sw.js").catch(() => {}); }

/* ---------- البداية ---------- */
(async () => {
  try { CFG = await (await fetch("/config.json")).json(); } catch (e) {}
  if (!CFG.authEnabled) { showApp(); return; }
  if (await refreshTok()) showApp(); else showAuth();
})();
</script>
</body>
